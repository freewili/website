<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="dip-title dip-desc">
  <title id="dip-title">DEF CON 34 badge eight-position DIP switch S7</title>
  <desc id="dip-desc">Front view with USB-C at the top of the badge. Switches 1 and 2 control 10BASE-T1S termination: both ON for an end node, both OFF for a drop node. Switches 3 through 8 control green LEDs 13, 12, 11, 10, 9 and 8, respectively. Move a switch toward the ON marking to turn it on. This example shows all eight switches OFF.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#ecedf1;text-anchor:middle}
    .group{font-size:17px;font-weight:700}
    .label{font-family:Consolas,monospace;font-size:15px}
    .muted{fill:#a6a9b3}
    .term{fill:#5dff7b}
    .led{fill:#ffb340}
    .slot{fill:#08080a;stroke:#62656f;stroke-width:1.5}
    .slider{fill:#ecedf1;stroke:#b5b7be;stroke-width:1}
    .leg{fill:#bd9350;stroke:#e0b774;stroke-width:1}
  </style>
  <rect width="720" height="350" rx="12" fill="#0d0d0f"/>
  <text class="group term" x="138" y="25">10BASE-T1S</text>
  <text class="label muted" x="138" y="47">Set 1 + 2 together</text>
  <path d="M79 74V61H197V74" fill="none" stroke="#5dff7b" stroke-width="2"/>
  <text class="group led" x="434" y="25">Six green indicator LEDs</text>
  <text class="label muted" x="434" y="47">Independent ON / OFF controls</text>
  <path d="M227 74V61H641V74" fill="none" stroke="#ffb340" stroke-width="2"/>
  <g class="leg">
    <path d="M91 81h20v13H91zM165 81h20v13h-20zM239 81h20v13h-20zM313 81h20v13h-20zM387 81h20v13h-20zM461 81h20v13h-20zM535 81h20v13h-20zM609 81h20v13h-20z"/>
    <path d="M91 238h20v13H91zM165 238h20v13h-20zM239 238h20v13h-20zM313 238h20v13h-20zM387 238h20v13h-20zM461 238h20v13h-20zM535 238h20v13h-20zM609 238h20v13h-20z"/>
  </g>
  <rect x="48" y="91" width="624" height="150" rx="10" fill="#1a1a1e" stroke="#858994" stroke-width="2"/>
  <text x="81" y="116" font-size="16" font-weight="700">ON</text>
  <path d="M59 150v-17m-5 6 5-6 5 6" fill="none" stroke="#ecedf1" stroke-width="2"/>
  <text x="625" y="116" class="label muted">S7</text>
  <g id="switch-1">
    <rect class="slot" x="80" y="128" width="42" height="68" rx="4"/>
    <rect class="slider" x="84" y="175" width="34" height="17" rx="2"/>
    <text class="term" x="101" y="225" font-size="21" font-weight="700">1</text>
  </g>
  <g id="switch-2">
    <rect class="slot" x="154" y="128" width="42" height="68" rx="4"/>
    <rect class="slider" x="158" y="175" width="34" height="17" rx="2"/>
    <text class="term" x="175" y="225" font-size="21" font-weight="700">2</text>
  </g>
  <g id="switch-3">
    <rect class="slot" x="228" y="128" width="42" height="68" rx="4"/>
    <rect class="slider" x="232" y="175" width="34" height="17" rx="2"/>
    <text class="led" x="249" y="225" font-size="21" font-weight="700">3</text>
  </g>
  <g id="switch-4">
    <rect class="slot" x="302" y="128" width="42" height="68" rx="4"/>
    <rect class="slider" x="306" y="175" width="34" height="17" rx="2"/>
    <text class="led" x="323" y="225" font-size="21" font-weight="700">4</text>
  </g>
  <g id="switch-5">
    <rect class="slot" x="376" y="128" width="42" height="68" rx="4"/>
    <rect class="slider" x="380" y="175" width="34" height="17" rx="2"/>
    <text class="led" x="397" y="225" font-size="21" font-weight="700">5</text>
  </g>
  <g id="switch-6">
    <rect class="slot" x="450" y="128" width="42" height="68" rx="4"/>
    <rect class="slider" x="454" y="175" width="34" height="17" rx="2"/>
    <text class="led" x="471" y="225" font-size="21" font-weight="700">6</text>
  </g>
  <g id="switch-7">
    <rect class="slot" x="524" y="128" width="42" height="68" rx="4"/>
    <rect class="slider" x="528" y="175" width="34" height="17" rx="2"/>
    <text class="led" x="545" y="225" font-size="21" font-weight="700">7</text>
  </g>
  <g id="switch-8">
    <rect class="slot" x="598" y="128" width="42" height="68" rx="4"/>
    <rect class="slider" x="602" y="175" width="34" height="17" rx="2"/>
    <text class="led" x="619" y="225" font-size="21" font-weight="700">8</text>
  </g>
  <path d="M101 261v10h74v-10" fill="none" stroke="#5dff7b" stroke-width="2"/>
  <text class="label term" x="138" y="297">ON: end node</text>
  <text class="label term" x="138" y="319">OFF: drop node</text>
  <g fill="none" stroke="#ffb340" stroke-width="1.5">
    <path d="M249 261v19M323 261v19M397 261v19M471 261v19M545 261v19M619 261v19"/>
  </g>
  <g fill="#172b1a" stroke="#5dff7b" stroke-width="1.5">
    <circle cx="249" cy="288" r="7"/><circle cx="323" cy="288" r="7"/>
    <circle cx="397" cy="288" r="7"/><circle cx="471" cy="288" r="7"/>
    <circle cx="545" cy="288" r="7"/><circle cx="619" cy="288" r="7"/>
  </g>
  <g class="label">
    <text x="249" y="319">LED13</text><text x="323" y="319">LED12</text>
    <text x="397" y="319">LED11</text><text x="471" y="319">LED10</text>
    <text x="545" y="319">LED9</text><text x="619" y="319">LED8</text>
  </g>
</svg>
