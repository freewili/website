<!DOCTYPE html>
<!-- Hidden page: FREE-WILi kit sign-out for hackathons (opened from the QR on the FREE-WILi table, freewili.com/kit/?e=<code>).
     Not linked from the site and not indexed. The form talks to the WILi Control Room server, which assigns the kit
     and records the loan. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Borrow a FREE-WILi kit</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #121111; color: #FFFFFF; font: 16px/1.5 'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 28px 20px 48px; }
  .brand { font: 700 13px 'Chakra Petch', Arial, sans-serif; letter-spacing: .18em; color: #EF393E; text-transform: uppercase; }
  h1 { font: 700 26px/1.2 'Chakra Petch', 'Trebuchet MS', Arial, sans-serif; margin: 6px 0 10px; }
  .lead { color: #D9D4D4; margin: 0 0 18px; }
  .fine { color: #9C9393; font-size: 13px; }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
  label i { font-weight: 400; color: #9C9393; }
  input { font: inherit; color: #FFFFFF; background: #1F1D1D; border: 1px solid #3A3636; border-radius: 10px; padding: 12px 14px; }
  input:focus { outline: 2px solid #EF393E; border-color: transparent; }
  .agree { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 400; color: #D9D4D4; }
  .agree input { width: 22px; height: 22px; margin-top: 2px; accent-color: #EF393E; flex: none; }
  button { font: 700 17px 'Chakra Petch', Arial, sans-serif; letter-spacing: .04em; color: #FFFFFF; background: #EF393E; border: 0; border-radius: 10px; padding: 15px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: #FF8A8D; margin: 0; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; }
  .kit { font: 700 64px/1 'Chakra Petch', Arial, sans-serif; color: #EF393E; text-align: center; padding: 26px 0; border: 2px solid #EF393E; border-radius: 16px; margin: 8px 0 14px; letter-spacing: .04em; }
  #ok { text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">FREE-WILi</div>
  <h1 id="title">Borrow a FREE-WILi kit</h1>
  <p class="lead" id="msg">Loading…</p>
  <form id="f" hidden novalidate>
    <label>Your name<input name="name" required autocomplete="name" maxlength="80"></label>
    <label>Email<input name="email" type="email" required autocomplete="email" maxlength="120"></label>
    <label>Phone<input name="phone" type="tel" required autocomplete="tel" maxlength="30"></label>
    <label>School or organization <i>(optional)</i><input name="school" autocomplete="organization" maxlength="80"></label>
    <label>Team or project <i>(optional)</i><input name="team" maxlength="80"></label>
    <label>Discord or GitHub <i>(optional)</i><input name="handle" maxlength="60"></label>
    <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="agree"><input type="checkbox" name="agree" required> <span>I’ll return the kit by <b id="due">the end of the event</b> in the condition I got it, and FREE-WILi may contact me about it if it’s lost or damaged.</span></label>
    <button type="submit">Get my kit</button>
    <p class="err" id="err" hidden></p>
    <p class="fine">Your details are only used to get the kit back to FREE-WILi.</p>
  </form>
  <div id="ok" hidden>
    <p class="lead">Show this at the FREE-WILi table</p>
    <div class="kit" id="kit"></div>
    <p class="lead" id="who"></p>
    <p class="fine">Please return it by <span id="due2">the end of the event</span>. Have fun building!</p>
  </div>
</main>
<script>
(function () {
  var API = 'https://34-63-217-136.sslip.io/control/kit/';
  var code = (new URLSearchParams(location.search).get('e') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var $ = function (id) { return document.getElementById(id); };
  var f = $('f'), err = $('err'), msg = $('msg');
  var say = function (t) { msg.textContent = t; msg.hidden = false; };
  if (code.length < 16) { say('This sign-out link isn’t complete. Scan the QR at the FREE-WILi table again.'); return; }
  fetch(API + code + '/info', { cache: 'no-store' }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
    if (!x.ok) return say(x.j.error || 'This sign-out link isn’t active. Ask someone at the FREE-WILi table.');
    if (x.j.title) { $('title').textContent = x.j.title; document.title = x.j.title + ' · FREE-WILi'; }
    if (x.j.due) { $('due').textContent = x.j.due; $('due2').textContent = x.j.due; }
    if (!x.j.open) return say('Kit sign-out is closed right now. Ask someone at the FREE-WILi table.');
    if (x.j.free === 0) return say('All kits are out right now. Ask someone at the FREE-WILi table. One may be back soon.');
    say('Borrow a FREE-WILi OG kit to build with. Fill this in, then show your screen at the FREE-WILi table to get your kit.');
    f.hidden = false;
  }).catch(function () { say('Couldn’t load the sign-out form. Check your connection, or ask someone at the FREE-WILi table.'); });

  f.addEventListener('submit', function (e) {
    e.preventDefault(); err.hidden = true;
    var d = {}; new FormData(f).forEach(function (v, k) { d[k] = v; }); d.agree = f.agree.checked;
    if (!String(d.name).trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email) || String(d.phone).replace(/\D/g, '').length < 7 || !d.agree) {
      err.textContent = 'Please add your name, a valid email, your phone number, and tick the box.'; err.hidden = false; return;
    }
    var b = f.querySelector('button'); b.disabled = true; b.textContent = 'Getting your kit…';
    fetch(API + code, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(d) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; }); })
      .then(function (j) {
        f.hidden = true; msg.hidden = true;
        $('kit').textContent = j.kit;
        $('who').textContent = j.again ? 'You already have this kit, ' + j.name + '.' : 'Your kit, ' + j.name + '.';
        $('ok').hidden = false; window.scrollTo(0, 0);
      })
      .catch(function (x) { err.textContent = x.message; err.hidden = false; b.disabled = false; b.textContent = 'Get my kit'; });
  });
})();
</script>
</body>
</html>
